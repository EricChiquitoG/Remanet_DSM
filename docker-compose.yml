version: '3.8'

services:
  db:
    image: mongo
    container_name: test-mongo
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DB:-dsm_db}
    volumes:
      - mongodata:/data/db
    networks:
      - optNetwork

  db-client:
    image: mongo-express:1
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@db:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_BASICAUTH_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_BASICAUTH_PASSWORD}
    depends_on:
      - db
    networks:
      - optNetwork

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      optimizer:
        condition: service_healthy
      db:
        condition: service_started
    ports:
      - "0.0.0.0:8080:8080"
      - "50050:50050"
    environment:
      - GRPC_PORT=${GRPC_PORT:-50050}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MONGODB_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@db:27017/
      - MONGODB_DB=${MONGODB_DB:-dsm_db}
      - OPTIMIZER_ADDR=${OPTIMIZER_ADDR:-optimizer:50060}
      - AAS_BASE_URL=${AAS_BASE_URL}
      - ACTOR_DIRECTORY=${ACTOR_DIRECTORY:-./data/directory.json}
      - HEALTH_MONGO_ADDR=${HEALTH_MONGO_ADDR:-db:27017}
      - HEALTH_OPTIMIZER_ADDR=${HEALTH_OPTIMIZER_ADDR:-optimizer:50060}
    networks:
      - optNetwork

  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    ports:
      - "50060:50060"
    environment:
      - OPTIMIZER_PORT=50060
    networks:
      - optNetwork
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 50060), timeout=2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: dsm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - optNetwork

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - optNetwork

volumes:
  mongodata:

networks:
  optNetwork:
    external: true
